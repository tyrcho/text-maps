<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-140 -140 619 280"
     width="619" height="280">
<defs>
  <pattern id="hatch" width="6" height="6"
           patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="1.2"/>
  </pattern>
  <pattern id="floorgrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#d8d8d8" stroke-width="0.5"/>
  </pattern>
  <symbol id="door-open" viewBox="0 0 30 30">
    <rect x="0"  y="12" width="30" height="6" fill="white"/>
    <rect x="0"  y="11" width="4"  height="8" fill="#333"/>
    <rect x="26" y="11" width="4"  height="8" fill="#333"/>
  </symbol>
  <symbol id="door-locked" viewBox="0 0 30 30">
    <rect x="0" y="12" width="30" height="6" fill="white"/>
    <rect x="2" y="11" width="26" height="8" fill="#333"/>
    <rect x="4" y="13" width="22" height="4" fill="white"/>
  </symbol>
  <symbol id="door-secret" viewBox="0 0 30 30">
    <line x1="0" y1="15" x2="30" y2="15"
          stroke="#888" stroke-width="1.2" stroke-dasharray="6,6"/>
  </symbol>
  <symbol id="door-barred" viewBox="0 0 30 30">
    <rect x="0"  y="12" width="30" height="6" fill="white"/>
    <rect x="2"  y="11" width="26" height="8" fill="#555"/>
    <line x1="8"  y1="11" x2="8"  y2="19" stroke="white" stroke-width="2"/>
    <line x1="15" y1="11" x2="15" y2="19" stroke="white" stroke-width="2"/>
    <line x1="22" y1="11" x2="22" y2="19" stroke="white" stroke-width="2"/>
  </symbol>
</defs>
<rect x="-140" y="-140" width="619" height="280" fill="white"/>
<rect x="-140" y="-140" width="619" height="280" fill="url(#hatch)"/>
<rect x="57" y="-15" width="222" height="30" fill="white"/>
<rect x="264" y="-63" width="30" height="63" fill="white"/>
<rect x="-60" y="-60" width="120" height="120" fill="white"/>
<rect x="159" y="-60" width="240" height="120" fill="white"/>
<rect x="-60" y="-60" width="120" height="120" fill="url(#floorgrid)"/>
<rect x="159" y="-60" width="240" height="120" fill="url(#floorgrid)"/>
<rect x="57" y="-15" width="222" height="30" fill="url(#floorgrid)"/>
<rect x="264" y="-63" width="30" height="63" fill="url(#floorgrid)"/>
<rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#333" stroke-width="1.5"/>
<rect x="159" y="-60" width="240" height="120" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="57" y1="-15" x2="279" y2="-15" stroke="#333" stroke-width="1.5"/>
<line x1="57" y1="15" x2="279" y2="15" stroke="#333" stroke-width="1.5"/>
<line x1="264" y1="-63" x2="264" y2="0" stroke="#333" stroke-width="1.5"/>
<line x1="294" y1="-63" x2="294" y2="0" stroke="#333" stroke-width="1.5"/>
<use href="#door-open" x="45" y="-15" width="30" height="30" transform="rotate(90,60,0)"/>
<text x="0" y="0" text-anchor="middle" dominant-baseline="middle" fill="#333" font-size="9" font-family="serif" font-style="italic">Entry</text>
<text x="279" y="0" text-anchor="middle" dominant-baseline="middle" fill="#333" font-size="9" font-family="serif" font-style="italic">Great Hall</text>
</svg>