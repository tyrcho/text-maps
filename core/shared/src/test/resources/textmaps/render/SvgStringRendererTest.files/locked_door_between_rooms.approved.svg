<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-125 -125 430 322"
     width="430" height="322">
<defs>
  <pattern id="hatch" width="6" height="6"
           patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="1.2"/>
  </pattern>

  <!-- ── Door symbols (viewBox 0 0 30 30, open gap fills corridor width) ── -->
  <symbol id="door-open" viewBox="0 0 30 30">
    <rect x="0"  y="12" width="30" height="6" fill="white"/>
    <rect x="0"  y="11" width="4"  height="8" fill="#333"/>
    <rect x="26" y="11" width="4"  height="8" fill="#333"/>
  </symbol>
  <symbol id="door-closed" viewBox="0 0 30 30">
    <rect x="0" y="12" width="30" height="6" fill="white"/>
    <rect x="2" y="13" width="26" height="4" fill="#333"/>
  </symbol>
  <symbol id="door-locked" viewBox="0 0 30 30">
    <rect x="0" y="12" width="30" height="6" fill="white"/>
    <rect x="2" y="11" width="26" height="8" fill="#333"/>
    <rect x="4" y="13" width="22" height="4" fill="white"/>
  </symbol>
  <symbol id="door-secret" viewBox="0 0 30 30">
    <line x1="0" y1="15" x2="30" y2="15"
          stroke="#888" stroke-width="1.2" stroke-dasharray="6,6"/>
  </symbol>

  <!-- ── Room feature symbols (viewBox 0 0 30 30, one grid cell) ── -->
  <symbol id="feat-ladder" viewBox="0 0 30 30">
    <line x1="8"  y1="3"  x2="8"  y2="27" stroke="#333" stroke-width="1.5"/>
    <line x1="22" y1="3"  x2="22" y2="27" stroke="#333" stroke-width="1.5"/>
    <line x1="8"  y1="7"  x2="22" y2="7"  stroke="#333" stroke-width="1"/>
    <line x1="8"  y1="13" x2="22" y2="13" stroke="#333" stroke-width="1"/>
    <line x1="8"  y1="19" x2="22" y2="19" stroke="#333" stroke-width="1"/>
    <line x1="8"  y1="25" x2="22" y2="25" stroke="#333" stroke-width="1"/>
  </symbol>
  <!-- Wall-placed feature symbol (30×6, designed to sit on a wall) -->
  <symbol id="feat-window" viewBox="0 0 30 6">
    <rect x="0"  y="0" width="30" height="6" fill="white"/>
    <rect x="0"  y="1" width="8"  height="4" fill="#cce" stroke="#99c" stroke-width="0.5"/>
    <rect x="11" y="1" width="8"  height="4" fill="#cce" stroke="#99c" stroke-width="0.5"/>
    <rect x="22" y="1" width="8"  height="4" fill="#cce" stroke="#99c" stroke-width="0.5"/>
  </symbol>
</defs>
<rect x="-125" y="-125" width="430" height="322" fill="white"/>

<rect x="42" y="-15" width="66" height="30" fill="white"/>
<line x1="42" y1="-15" x2="108" y2="-15" stroke="#333" stroke-width="1.5"/>
<line x1="42" y1="15" x2="108" y2="15" stroke="#333" stroke-width="1.5"/>
<line x1="72" y1="-15" x2="72" y2="15" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="102" y1="-15" x2="102" y2="15" stroke="#d8d8d8" stroke-width="0.5"/>
<rect x="-45" y="-45" width="90" height="90" fill="white"/>
<rect x="105" y="-45" width="120" height="90" fill="white"/>
<rect x="-45" y="-45" width="90" height="90" fill="none" stroke="#333" stroke-width="1.5"/>
<rect x="105" y="-45" width="120" height="90" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="-15" y1="-45" x2="-15" y2="45" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="15" y1="-45" x2="15" y2="45" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="-45" y1="-15" x2="45" y2="-15" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="-45" y1="15" x2="45" y2="15" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="135" y1="-45" x2="135" y2="45" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="165" y1="-45" x2="165" y2="45" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="195" y1="-45" x2="195" y2="45" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="105" y1="-15" x2="225" y2="-15" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="105" y1="15" x2="225" y2="15" stroke="#d8d8d8" stroke-width="0.5"/>

<use href="#door-locked" x="30" y="-15" width="30" height="30" preserveAspectRatio="none" transform="rotate(90,45,0)"/>
<use href="#door-locked" x="90" y="-15" width="30" height="30" preserveAspectRatio="none" transform="rotate(90,105,0)"/>
<text x="0" y="-32" text-anchor="middle" dominant-baseline="auto" fill="#333" font-size="9" font-family="sans-serif" font-weight="bold">1</text>
<text x="165" y="-32" text-anchor="middle" dominant-baseline="auto" fill="#333" font-size="9" font-family="sans-serif" font-weight="bold">2</text>
<text x="-65" y="85" fill="#333" font-size="10" font-family="sans-serif" font-weight="bold">Legend</text>
<text x="-65" y="99" fill="#555" font-size="9" font-family="serif" font-style="italic">1 - Guard</text>
<text x="-65" y="113" fill="#555" font-size="9" font-family="serif" font-style="italic">2 - Prison</text>

</svg>