<use href="#feat-arrow-slit" x="69" y="-15" width="30" height="6" transform="rotate(90,72,0)"/>
<use href="#feat-bed" x="-15" y="-60" width="30" height="24" transform="rotate(180,0,-48)"/>
<use href="#feat-bed" x="-15" y="36" width="30" height="24"/>
<use href="#feat-illusory-wall" x="237" y="56" width="30" height="4"/>
<use href="#feat-fireplace" x="237" y="-60" width="30" height="20" transform="rotate(180,252,-50)"/>
<use href="#feat-curtain" x="177" y="-15" width="30" height="16" transform="rotate(-90,185,0)"/>
<use href="#door-open" x="60" y="-15" width="30" height="30" preserveAspectRatio="none" transform="rotate(90,75,0)"/>
<use href="#door-open" x="162" y="-15" width="30" height="30" preserveAspectRatio="none" transform="rotate(90,177,0)"/>
