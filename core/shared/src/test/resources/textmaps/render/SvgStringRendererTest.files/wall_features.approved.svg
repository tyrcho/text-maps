<line x1="-75" y1="30" x2="75" y2="30" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="207" y1="-60" x2="207" y2="60" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="237" y1="-60" x2="237" y2="60" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="267" y1="-60" x2="267" y2="60" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="297" y1="-60" x2="297" y2="60" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="177" y1="-30" x2="327" y2="-30" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="177" y1="0" x2="327" y2="0" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="177" y1="30" x2="327" y2="30" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="102" y1="-15" x2="102" y2="15" stroke="#d8d8d8" stroke-width="0.5"/>
<line x1="132" y1="-15" x2="132" y2="15" stroke="#d8d8d8" stroke-width="0.5"/>
