<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TTRPG map generator — write a text DSL and see your map rendered live.">
  <title>text-maps</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"
          integrity="sha512-qtX0GLM3qX8rxJN1gyDfcnMFFrKvixfoEOwbBib9VafR5vbChV5LeE5wSI/x+IlCkTY5ZFddFDCCfaVJJNnuKQ=="
          crossorigin="anonymous"
          defer></script>
  <style>
    :root {
      --color-brand:   #7c3aed;
      --color-bg:      #1a1a2e;
      --color-surface: #16213e;
      --color-panel:   #0f3460;
      --color-text:    #e8e8e8;
      --color-muted:   #888;
      --color-border:  #2a2a4a;
      --color-error:   #f87171;
      --color-success: #4ade80;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --color-brand:   #7c3aed;
        --color-bg:      #f5f3ff;
        --color-surface: #fff;
        --color-panel:   #ede9fe;
        --color-text:    #1a1a1a;
        --color-muted:   #6b7280;
        --color-border:  #ddd6fe;
        --color-error:   #dc2626;
        --color-success: #16a34a;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    #toolbar h1 { font-size: 1rem; font-weight: 700; color: var(--color-brand); }
    #toolbar .spacer { flex: 1; }
    .toolbar-btn {
      padding: 0.3rem 0.75rem;
      font-size: 0.85rem;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-panel);
      color: var(--color-text);
      cursor: pointer;
    }
    .toolbar-btn:hover { border-color: var(--color-brand); }

    /* ── Split pane ── */
    #split {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #editor-pane {
      width: 40%;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--color-border);
    }
    #dsl-input {
      flex: 1;
      width: 100%;
      padding: 1rem;
      font-family: "Cascadia Code", "Fira Code", ui-monospace, monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      background: var(--color-bg);
      color: var(--color-text);
      border: none;
      resize: none;
      outline: none;
    }
    #error-banner {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      color: var(--color-error);
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      min-height: 1.8rem;
      display: none;
    }
    #error-banner.visible { display: block; }

    /* ── Map preview ── */
    #preview-pane {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg);
    }
    #map-svg {
      width: 100%;
      height: 100%;
    }

    /* ── SVG map styles ── */
    #map-svg {
      background: #0d0d0f;
      font-family: "Cascadia Code", "Fira Code", ui-monospace, monospace;
    }
    .room text { pointer-events: none; }
  </style>
</head>
<body>
  <div id="toolbar">
    <h1>text-maps</h1>
    <span class="spacer"></span>
    <button class="toolbar-btn" id="btn-share">Share</button>
  </div>
  <div id="split">
    <div id="editor-pane">
      <textarea id="dsl-input" spellcheck="false" autocomplete="off"></textarea>
      <div id="error-banner"></div>
    </div>
    <div id="preview-pane">
      <svg id="map-svg"></svg>
    </div>
  </div>
  <div id="app" style="display:none"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
